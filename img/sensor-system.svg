<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="Sender to receiver to cloud">
  <style>
    .box { fill: #2a2a2a; stroke: #6cc; stroke-width: 2; rx: 8; }
    .lbl { font: 14px system-ui, sans-serif; fill: #e0e0e0; text-anchor: middle; }
    .sub { font: 11px system-ui, sans-serif; fill: #999; text-anchor: middle; }
    .arrow { stroke: #6cc; stroke-width: 2; fill: none; }
    .arrowhead { fill: #6cc; }
    .radio { font: 10px system-ui, sans-serif; fill: #6cc; text-anchor: middle; }
    .placeholder { font: 9px system-ui, sans-serif; fill: #666; text-anchor: middle; font-style: italic; }
  </style>
  <rect x="20" y="60" width="140" height="80" class="box"/>
  <text x="90" y="95" class="lbl">Sender (Rook)</text>
  <text x="90" y="115" class="sub">ultrasonic + LoRa</text>
  <path class="arrow" d="M 165 100 L 235 100"/>
  <polygon class="arrowhead" points="235,95 245,100 235,105"/>
  <text x="200" y="90" class="radio">LoRa</text>
  <rect x="250" y="60" width="140" height="80" class="box"/>
  <text x="320" y="95" class="lbl">Receiver (Heltec V3)</text>
  <text x="320" y="115" class="sub">LoRa + WiFi</text>
  <path class="arrow" d="M 395 100 L 465 100"/>
  <polygon class="arrowhead" points="465,95 475,100 465,105"/>
  <text x="430" y="90" class="radio">WiFi</text>
  <rect x="480" y="60" width="100" height="80" class="box"/>
  <text x="530" y="95" class="lbl">Bayou</text>
  <text x="530" y="115" class="sub">cloud store</text>
  <text x="300" y="185" class="placeholder">placeholder — replace /img/sensor-system.svg</text>
</svg>
