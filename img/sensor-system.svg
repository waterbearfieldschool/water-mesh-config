<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" role="img" aria-label="Sender to receiver to cloud">
  <style>
    .box { fill: #2a2a2a; stroke: #6cc; stroke-width: 2; }
    .lbl { font: 12px system-ui, sans-serif; fill: #e0e0e0; text-anchor: middle; }
    .sub { font: 10px system-ui, sans-serif; fill: #999; text-anchor: middle; }
    .arrow { stroke: #6cc; stroke-width: 2; fill: none; }
    .arrowhead { fill: #6cc; }
    .radio { font: 10px system-ui, sans-serif; fill: #6cc; text-anchor: middle; }
  </style>

  <rect x="20"  y="30" width="180" height="220" rx="8" class="box"/>
  <image href="img/rook_ultrasonic_sender_closeup.png" x="35" y="40" width="150" height="150" preserveAspectRatio="xMidYMax meet"/>
  <text x="110" y="215" class="lbl">Sender (Rook)</text>
  <text x="110" y="235" class="sub">ultrasonic + LoRa</text>

  <path class="arrow" d="M 210 140 L 265 140"/>
  <polygon class="arrowhead" points="265,134 277,140 265,146"/>
  <text x="238" y="128" class="radio">LoRa</text>

  <rect x="290" y="30" width="180" height="220" rx="8" class="box"/>
  <image href="img/sensor_receiver.png" x="305" y="40" width="150" height="150" preserveAspectRatio="xMidYMax meet"/>
  <text x="380" y="215" class="lbl">Receiver (Heltec V3)</text>
  <text x="380" y="235" class="sub">LoRa + WiFi</text>

  <path class="arrow" d="M 480 140 L 535 140"/>
  <polygon class="arrowhead" points="535,134 547,140 535,146"/>
  <text x="508" y="128" class="radio">WiFi</text>

  <rect x="560" y="90" width="90" height="100" rx="8" class="box"/>
  <text x="605" y="130" class="lbl">Bayou</text>
  <text x="605" y="150" class="sub">cloud store</text>
</svg>
