<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Sender to receiver to cloud">
  <style>
    .box { fill: #2a2a2a; stroke: #6cc; stroke-width: 2; }
    .lbl { font: 14px system-ui, sans-serif; fill: #e0e0e0; text-anchor: middle; }
    .sub { font: 11px system-ui, sans-serif; fill: #999; text-anchor: middle; }
    .arrow { stroke: #6cc; stroke-width: 2; fill: none; }
    .arrowhead { fill: #6cc; }
    .radio { font: 10px system-ui, sans-serif; fill: #6cc; text-anchor: middle; }
  </style>

  <rect x="20"  y="30" width="150" height="220" rx="8" class="box"/>
  <image href="img/rook_ultrasonic_sender_closeup.png" x="30" y="40" width="130" height="150" preserveAspectRatio="xMidYMax meet"/>
  <text x="95"  y="215" class="lbl">Sender (Rook)</text>
  <text x="95"  y="235" class="sub">ultrasonic + LoRa</text>

  <path class="arrow" d="M 190 140 L 250 140"/>
  <polygon class="arrowhead" points="250,134 262,140 250,146"/>
  <text x="226" y="128" class="radio">LoRa</text>

  <rect x="280" y="30" width="150" height="220" rx="8" class="box"/>
  <image href="img/sensor_receiver.png" x="290" y="40" width="130" height="150" preserveAspectRatio="xMidYMax meet"/>
  <text x="355" y="215" class="lbl">Receiver (Heltec V3)</text>
  <text x="355" y="235" class="sub">LoRa + WiFi</text>

  <path class="arrow" d="M 450 140 L 510 140"/>
  <polygon class="arrowhead" points="510,134 522,140 510,146"/>
  <text x="486" y="128" class="radio">WiFi</text>

  <rect x="530" y="90" width="100" height="100" rx="8" class="box"/>
  <text x="580" y="130" class="lbl">Bayou</text>
  <text x="580" y="150" class="sub">cloud store</text>
</svg>
