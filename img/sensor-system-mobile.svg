<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 620" role="img" aria-label="Sender to receiver to cloud">
  <style>
    .box { fill: #2a2a2a; stroke: #6cc; stroke-width: 2; }
    .lbl { font: 16px system-ui, sans-serif; fill: #e0e0e0; text-anchor: middle; }
    .sub { font: 13px system-ui, sans-serif; fill: #999; text-anchor: middle; }
    .arrow { stroke: #6cc; stroke-width: 2; fill: none; }
    .arrowhead { fill: #6cc; }
    .radio { font: 12px system-ui, sans-serif; fill: #6cc; text-anchor: start; }
  </style>

  <rect x="40"  y="10"  width="220" height="200" rx="8" class="box"/>
  <image href="img/rook_ultrasonic_sender_closeup.png" x="50" y="20" width="200" height="140" preserveAspectRatio="xMidYMax meet"/>
  <text x="150" y="180" class="lbl">Sender (Rook)</text>
  <text x="150" y="200" class="sub">ultrasonic + LoRa</text>

  <path class="arrow" d="M 150 220 L 150 246"/>
  <polygon class="arrowhead" points="144,246 156,246 150,258"/>
  <text x="165" y="240" class="radio">LoRa</text>

  <rect x="40"  y="264" width="220" height="200" rx="8" class="box"/>
  <image href="img/sensor_receiver.png" x="50" y="274" width="200" height="140" preserveAspectRatio="xMidYMax meet"/>
  <text x="150" y="434" class="lbl">Receiver (Heltec V3)</text>
  <text x="150" y="454" class="sub">LoRa + WiFi</text>

  <path class="arrow" d="M 150 474 L 150 500"/>
  <polygon class="arrowhead" points="144,500 156,500 150,512"/>
  <text x="165" y="494" class="radio">WiFi</text>

  <rect x="75"  y="518" width="150" height="90" rx="8" class="box"/>
  <text x="150" y="558" class="lbl">Bayou</text>
  <text x="150" y="578" class="sub">cloud store</text>
</svg>
